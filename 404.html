<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PrepMate</title>
  <script>
    // GitHub Pages serves this file for unknown paths. Keep the app path and
    // import fragment while redirecting to the Flutter entry point.
    (function (location) {
      // Production uses the custom-domain root, while the Pages preview uses
      // /prepmate/. Keep both bases working for direct deep links.
      var segments = location.pathname.split('/').filter(Boolean);
      var isProjectSite = segments[0] === 'prepmate';
      var base = isProjectSite ? '/prepmate/' : '/';
      var routeSegments = isProjectSite ? segments.slice(1) : segments;
      var route = routeSegments.join('/');
      var query = location.search ? '&' + location.search.slice(1).replace(/&/g, '~and~') : '';
      location.replace(
        location.protocol + '//' + location.host + base + '/?/' + route + query + location.hash
      );
    }(window.location));
  </script>
</head>
<body></body>
</html>
