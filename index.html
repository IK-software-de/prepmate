<!DOCTYPE html>
<html lang="de">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  
  <!-- HTTP-Cache verhindern: Zwingt den Browser, immer nach der neuesten index.html zu fragen -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <meta name="theme-color" content="#2A9D8F">
  <meta name="description" content="PrepMate – Rezepte, Einkaufsliste und Körper-Tracking für die intelligente Ernährungsplanung.">

  <!-- iOS/PWA meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PrepMate">
  <link rel="apple-touch-icon" href="icons/Icon-apple-touch-180.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PrepMate</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html,
    body,
    flutter-view,
    flt-glass-pane,
    #flutter_host {
      width: 100%;
      height: 100dvh;
      margin: 0;
      overscroll-behavior: none;
      touch-action: pan-x pan-y pinch-zoom;
    }

    flutter-view,
    flt-glass-pane,
    #flutter_host {
      display: block;
      overscroll-behavior-x: contain;
    }

    /* Nur Hintergrundfarbe, bewusst KEIN Logo/Icon: Die eigentliche
       Splash-Animation (lib/widgets/splash_screen.dart, "my"/"prep"/"mate"
       Wortmarken-Wipe) läuft bereits ab der ersten Flutter-Frame als
       Overlay. Ein zusätzliches Icon hier würde davor aufblitzen statt
       nahtlos in die Animation überzugehen. Farbe = AppColors.light
       .background (lib/constants/app_colors.dart). Bewusst KEIN
       `@media (prefers-color-scheme: dark)`: Das App-Theme folgt dem
       Browser/System-Dark-Mode NICHT (siehe ThemeModeNotifier in
       lib/providers/settings_provider.dart — rein manueller Toggle, startet
       ohne gespeicherte Präferenz immer hell). Ein an prefers-color-scheme
       gekoppelter dunkler Splash würde bei jedem Dark-Mode-Browser einen
       dunkel→hell-Bruch erzeugen, sobald Flutter (hell) übernimmt. Das
       Inline-Script unten liest stattdessen die tatsächliche, in
       localStorage persistierte Präferenz (denselben Wert, den
       shared_preferences_web unter dem Schlüssel "flutter.themeMode"
       ablegt) und setzt die Hintergrundfarbe synchron vor dem ersten Paint. */
    #splash {
      position: fixed;
      inset: 0;
      background-color: #FAF9F6;
      z-index: 9999;
    }
  </style>
</head>
<body>
  <script>
    // Restores a path encoded by 404.html before Flutter reads the initial URL.
    (function (location) {
      if (location.search[1] === '/') {
        var path = location.search.slice(1).split('&').map(function (part) {
          return part.replace(/~and~/g, '&');
        }).join('?');
        window.history.replaceState(null, '', location.pathname.slice(0, -1) + path + location.hash);
      }
    }(window.location));

    // Splash-Hintergrund an die tatsächliche App-Theme-Präferenz angleichen
    // (siehe Kommentar im <style>-Block oben). Läuft synchron vor dem
    // #splash-Markup, damit kein falsch gefärbter Frame sichtbar wird.
    (function () {
      try {
        var stored = window.localStorage.getItem('flutter.themeMode');
        if (stored === 'dark') {
          document.write('<style>#splash{background-color:#141614}</style>');
        }
      } catch (e) {
        // localStorage kann in privaten/eingeschränkten Kontexten fehlen —
        // dann bleibt der helle Default aus dem <style>-Block oben stehen.
      }
    }());
  </script>

  <!-- Hält nur die Hintergrundfarbe der Splash-Animation vor, bis die
       Flutter-Engine (inkl. WASM-Download) die erste Frame zeichnet. -->
  <div id="splash"></div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (splash) {
        splash.remove();
      }
    });

    // Erfasse Service Worker Updates sofort und erzwinge ein Neuladen der App bei neuen Versionen
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('controllerchange', function() {
        window.location.reload();
      });
    }
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
